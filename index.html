<!DOCTYPE html>
<!-- 한국어 페이지다. lang="en"이면 크롬이 "한국어로 번역"을 띄우고, 번역이 글자를 <font>로
     바꿔 끼우면 React가 화면을 고치다 NotFoundError(insertBefore)로 앱 전체가 깨진다.
     그래서 언어를 ko로 두고 번역도 끈다. -->
<html lang="ko" translate="no">
  <head>
    <!-- Google Tag Manager (GTM-P6C7B44R) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // 실서비스 주소에서만 GTM을 불러온다. localhost와 Vercel 미리보기
      // 배포(*-git-*.vercel.app)에서는 로드되지 않으므로, GA4와 메타 픽셀
      // 양쪽 모두에 테스트 데이터가 나가지 않는다.
      // GTM을 안 불러와도 analytics.ts의 dataLayer.push는 그대로 동작한다 —
      // 배열에 쌓이기만 하고 밖으로 전송되지 않는다.
      // 커스텀 도메인을 붙이면 이 목록에 추가할 것.
      // 로컬에서 GTM 동작을 확인해야 할 땐 잠시 'localhost'를 넣었다 뺀다.
      var PROD_HOSTS = ['fedit.mify.im', 'fedit.vercel.app'];
      if (PROD_HOSTS.indexOf(location.hostname) !== -1) {
        var gtmScript = document.createElement('script');
        gtmScript.async = true;
        gtmScript.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-P6C7B44R';
        document.head.appendChild(gtmScript);
      }
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/feditIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fedit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
